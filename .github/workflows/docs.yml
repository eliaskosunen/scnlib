name: Documentation

on:
  push:
    branches:
      - master
    paths:
      - "**.h"
      - "**.hpp"
      - "**.dox"
      - "**.md"
      - "docs/**"
      - "**/docs.yml"
      - '.github/workflows/docs.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}${{ github.ref == 'refs/heads/master' && format('-{0}', github.sha) || '' }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      REF_NAME: ${{ github.ref_name }}

    steps:
      - name: Install dependencies
        run: |
          sudo apt -y update
          sudo apt -y install --no-install-recommends git python3 python3-pip doxygen libgs-dev
          sudo -H pip3 install poxy==0.27.1

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Prepare repository (on push)
        if: ${{ github.event_name == 'push' }}
        run: |
          git fetch origin "$REF_NAME:refs/remotes/origin/$REF_NAME" --tags --force
          git remote set-head origin -a
          git checkout "$REF_NAME"
          git pull --force

      - name: Prepare repository (on release)
        if: ${{ github.event_name == 'release' }}
        run: |
          git fetch origin master:refs/remotes/origin/master --tags --force
          git remote set-head origin -a
          git checkout master
          git pull --force

      - name: Prepare repository (on workflow_dispatch)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          git fetch origin master:refs/remotes/origin/master --tags --force
          git remote set-head origin -a
          git checkout "$REF_NAME"
          git pull --force

      - name: Generate docs
        run: |
          cd docs
          poxy --verbose --git-tags --min-version v2.0.0

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/html
          keep_files: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: Update documentation (GitHub actions deploy)
