name: macOS

on:
  push:
    branches:
      - master
      - v*/dev
      - ci/*
      - dev/*
    paths:
      - '.github/workflows/macos.yml'
      - 'benchmark/**'
      - 'cmake/**'
      - 'examples/**'
      - 'include/**'
      - 'src/**'
      - 'tests/unittests/**'
      - '**/CMakeLists.txt'
  pull_request:
    branches:
      - master
      - v*/dev
      - ci/*
      - dev/*
    paths:
      - '.github/workflows/macos.yml'
      - 'benchmark/**'
      - 'cmake/**'
      - 'examples/**'
      - 'include/**'
      - 'src/**'
      - 'tests/unittests/**'
      - '**/CMakeLists.txt'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}-${{ github.ref_type == 'branch' && github.sha }}-${{ github.event_name == 'workflow_dispatch' }}-${{ github.event_name == 'schedule' }}-${{ github.event.schedule }}
  cancel-in-progress: true

env:
  CCACHE_ABSSTDERR: true
  CCACHE_COMPRESS: true
  CCACHE_COMPRESSLEVEL: 6
  CCACHE_DIR: "/tmp/ccache"
  CCACHE_MAXSIZE: 50M
  CCACHE_NOHASHDIR: true
  CCACHE_SLOPPINESS: "pch_defines,time_macros"
  CCACHE_UNIFY: true

jobs:
  build:
    runs-on: macos-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          # arm64 macs
          - 26
          - 15
          # intel (x86_64) macs
          - 26-intel
          - 15-intel
        cxx: [ brew-clang++, clang++ ]
        std: [ 17 ]

        include:
          # brew-clang++ with later standards on macos 26
          - os: 26
            cxx: brew-clang++
            std: 20
          - os: 26
            cxx: brew-clang++
            std: 23

          # gcc on macos 26 (arm64)
          # gcc 14 and 13 are also installed, but seem to be a little broken
          - os: 26
            cxx: g++-15
            std: 17

          # gcc on macos 15 (arm64)
          # gcc 14 and 13 are also installed, but seem to be a little broken
          - os: 15
            cxx: g++-15
            std: 17

    env:
      CXX: ${{ matrix.cxx }}
      OS: ${{ matrix.os }}
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create Build Environment
        run: |
          mkdir ${{ runner.workspace }}/build
          brew install --overwrite ccache

      - name: Setup Homebrew clang
        if: ${{ matrix.cxx == 'brew-clang++' }}
        run: |
          llvm_root="$(brew --prefix llvm)"
          echo "${llvm_root}/bin" >> $GITHUB_PATH
          echo "CXX=clang++" >> $GITHUB_ENV
          echo "LDFLAGS=-Wl,-rpath,${llvm_root}" >> $GITHUB_ENV
          echo "CPPFLAGS=-isystem ${llvm_root}/include" >> $GITHUB_ENV
          echo "CXXFLAGS=-isystem ${llvm_root}/include/c++/v1" >> $GITHUB_ENV

      - name: Load ccache
        uses: actions/cache@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ github.workflow }}-macos${{ matrix.os }}-${{ matrix.cxx }}-std${{ matrix.std }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ github.workflow }}-macos${{ matrix.os }}-${{ matrix.cxx }}-std${{ matrix.std }}-${{ github.ref }}
            ccache-${{ github.workflow }}-macos${{ matrix.os }}-${{ matrix.cxx }}-std${{ matrix.std }}-${{ github.base_ref }}
            ccache-${{ github.workflow }}-macos${{ matrix.os }}-${{ matrix.cxx }}-std${{ matrix.std }}

      - name: Setup ccache
        run: |
          ccache --version
          ccache --zero-stats
          ccache --show-stats
          ccache --show-config

      # TEMPORARY: standalone reproducer for wide string literals getting
      # corrupted across translation units with g++ at -O0 on macOS.
      # Checks the literal contents at runtime, at several optimization levels,
      # and dumps which sections GCC places the literals in.
      - name: Wide string literal reproducer
        if: ${{ startsWith(matrix.cxx, 'g++') }}
        continue-on-error: true
        run: |
          mkdir -p ${{ runner.temp }}/wlit && cd ${{ runner.temp }}/wlit
          cat > a.cpp <<'EOF'
          const wchar_t* a_fmt() { return L"{}"; }
          const wchar_t* a_str() { return L"abc def"; }
          EOF
          cat > b.cpp <<'EOF'
          const wchar_t* b_fmt() { return L"{}"; }
          const wchar_t* b_str() { return L"foobar"; }
          EOF
          cat > main.cpp <<'EOF'
          #include <cstdio>
          #include <cstring>
          const wchar_t* a_fmt();
          const wchar_t* a_str();
          const wchar_t* b_fmt();
          const wchar_t* b_str();
          static int check(const char* name, const wchar_t* got, const char* expected)
          {
              // Compare against the narrow string, widened at runtime
              std::size_t n = std::strlen(expected);
              bool ok = true;
              for (std::size_t i = 0; i <= n; ++i) {
                  if (got[i] != static_cast<wchar_t>(static_cast<unsigned char>(expected[i]))) {
                      ok = false;
                  }
              }
              std::printf("%-6s %p %s:", name, static_cast<const void*>(got), ok ? "OK      " : "MISMATCH");
              for (std::size_t i = 0; i <= n; ++i) {
                  std::printf(" %08x", static_cast<unsigned>(got[i]));
              }
              std::printf("\n");
              return ok ? 0 : 1;
          }
          int main()
          {
              int failures = 0;
              failures += check("a_fmt", a_fmt(), "{}");
              failures += check("a_str", a_str(), "abc def");
              failures += check("b_fmt", b_fmt(), "{}");
              failures += check("b_str", b_str(), "foobar");
              return failures;
          }
          EOF
          set +e
          for opt in "-O0" "-O0 -fmerge-constants" "-O2"; do
            echo "::group::$CXX $opt"
            $CXX $opt -c a.cpp -o a.o && $CXX $opt -c b.cpp -o b.o && $CXX $opt -c main.cpp -o main.o
            $CXX $opt main.o a.o b.o -o repro && ./repro
            echo "exit code: $?"
            echo "--- sections of b.o:"
            otool -lv b.o | grep -A1 sectname
            echo "--- assembly of b.cpp:"
            $CXX $opt -S b.cpp -o - | grep -vE '^\s*\.(cfi|loc|file)'
            echo "::endgroup::"
          done
          $CXX --version
          ld -v 2>&1 | head -1

      - name: Run CMake
        working-directory: ${{ runner.workspace }}/build
        run: |
          cmake -DSCN_CI=ON -DCMAKE_CXX_STANDARD=${{ matrix.std }} -DCMAKE_BUILD_TYPE=Debug $GITHUB_WORKSPACE

      - name: Build
        working-directory: ${{ runner.workspace }}/build
        run: cmake --build . --parallel --verbose -- -k

      - name: Show ccache stats
        run: |
          ccache --show-stats

      - name: Test
        working-directory: ${{ runner.workspace }}/build
        run: ctest --output-on-failure
